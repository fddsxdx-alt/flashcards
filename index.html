<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Флеш-карточки · Обществознание · v11</title>
<style>
  :root {
    --bg: #171a21; --bg2: #14161c;
    --panel: #1f2430; --board: #242a38;
    --ink: #eef1f6; --muted: #8b93a3;
    --accent: #5b8def; --accent-soft: #22304a;
    --gold: #e0b45a; --gold-soft: #2a2416; --green: #3ecf8e; --red: #ff6b6b;
    --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #1d2330 0%, var(--bg) 55%);
         color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* ---- shared structure ---- */
  main { max-width: 560px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column;
         padding: max(1.1rem, env(safe-area-inset-top)) 1.25rem 1rem; }
  .screen { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .screen.hidden { display: none; }

  header { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; padding-bottom: .9rem; }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: -.3px; }
  .back { cursor: pointer; background: none; border: none; color: var(--muted); font-size: 1.5rem;
          line-height: 1; padding: .1rem .4rem; margin-left: -.5rem; }
  .close { cursor: pointer; background: none; border: none; color: var(--muted); font-size: 1.4rem;
           line-height: 1; padding: .2rem .5rem; margin-left: auto; }

  /* ---- menu / theme hub ---- */
  .menu-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; position: relative; padding-top: 10vh; }
  .menu-wrap .close { position: absolute; top: 0; right: 0; margin-left: 0; }
  .menu-title { text-align: center; font-size: 2.3rem; font-weight: 800; letter-spacing: -.6px;
                margin: 0 0 1.6rem; }
  .swipe-note { color: var(--muted); font-size: .8rem; text-align: center; margin: .8rem 0 .4rem; }
  .theme .tinfo span.prog { color: var(--gold); font-weight: 600; margin-top: .3rem; }
  .theme .t-perc { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.25rem;
                   color: var(--muted); flex-shrink: 0; }
  .theme .t-perc.done { color: var(--green); }

  .theme-list { display: flex; flex-direction: column; gap: .7rem; overflow-y: auto; flex: 1; padding-bottom: 1rem; }
  .theme {
    display: flex; align-items: center; gap: .9rem; cursor: pointer; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 1rem 1.1rem; color: var(--ink); transition: background .15s, border-color .15s, transform .1s;
    width: 100%;
  }
  .theme:active { transform: scale(.985); }
  .theme:hover { border-color: var(--accent); background: #232a39; }
  .theme .tnum { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft);
                 color: var(--accent); display: flex; align-items: center; justify-content: center;
                 font-weight: 800; font-size: 1.05rem; flex-shrink: 0; }
  .theme:nth-child(2n) .tnum { background: #332a15; color: var(--gold); }
  .theme .tinfo { flex: 1; min-width: 0; }
  .theme .tinfo b { display: block; font-size: 1rem; }
  .theme .tinfo span { color: var(--muted); font-size: .82rem; display: block; margin-top: .15rem;
                       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme .arrow { color: var(--muted); font-size: 1.2rem; flex-shrink: 0; }

  /* ---- study ---- */
  .topbar { display: flex; align-items: center; gap: .8rem; flex-shrink: 0; margin-bottom: .4rem; }
  .progress { flex: 1; height: 12px; background: var(--panel); border-radius: 6px; overflow: hidden; }
  .progress .prog-segs { display: flex; width: 100%; height: 100%; }
  .progress .seg { height: 100%; min-width: 0; transition: none; }
  .progress .seg.ok { background: var(--green); }
  .progress .seg.bad { background: var(--red); }
  .progress-num { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5rem; text-align: right; }

  .stage { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .counter { text-align: center; color: var(--muted); font-size: .82rem; letter-spacing: .3px; flex-shrink: 0; padding-bottom: .5rem; }
  .card-wrap { position: relative; flex: 1; perspective: 1400px; flex-shrink: 0; min-height: 0; }
  .card { position: absolute; inset: 0; background: var(--panel); border: 1px solid var(--line);
          border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;
          user-select: none; box-shadow: 0 14px 40px rgba(0,0,0,.4); will-change: transform; }
  .card.flipped .inner { transform: rotateY(180deg); }
  .inner { position: absolute; inset: 0; transition: transform .55s; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          display: flex; flex-direction: column; padding: 1.6rem 1.5rem 1.2rem; }
  .face.back { transform: rotateY(180deg); }
  .cat { font-size: .72rem; letter-spacing: .8px; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: .6rem; }
  .face.back .cat { color: var(--accent); }
  .term { font-size: 1.4rem; font-weight: 700; line-height: 1.3; overflow-y: auto; }
  .def { font-size: .96rem; line-height: 1.65; overflow-y: auto; margin-top: .4rem; }
  .def p { margin: 0 0 .6rem; }
  .def .k { color: var(--accent); font-weight: 700; }
  .card-hint { margin-top: auto; padding: .6rem .7rem; border-radius: 10px; background: var(--gold-soft);
               border: 1px dashed var(--gold); color: var(--gold); font-size: .85rem; font-weight: 600;
               line-height: 1.35; text-align: center; }
  .tap-hint { margin-top: auto; text-align: center; color: var(--muted); font-size: .78rem; padding-top: .8rem; }

  .swipe-hint { position: absolute; top: 15%; right: 1.2rem; left: 1.2rem; pointer-events: none; z-index: 5; }
  .swipe-hint span { position: absolute; font-size: .85rem; font-weight: 700; letter-spacing: .4px; opacity: 0; transition: opacity .15s; }
  .swipe-hint .no { right: 0; color: var(--red); }
  .swipe-hint .yes { left: 0; color: var(--green); }

  .actions { display: flex; gap: .8rem; justify-content: center; align-items: center; flex-shrink: 0; padding: 1rem 0 .6rem; }
  .btn { cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
         border-radius: 12px; padding: .8rem 0; font-size: .95rem; font-weight: 600; transition: background .15s; }
  .btn:active { transform: scale(.96); }
  .btn.no { flex: 1; color: var(--red); max-width: 150px; }
  .btn.flip-c { flex: 0 0 auto; padding: .8rem 1.2rem; }
  .btn.yes { flex: 1; color: var(--green); max-width: 150px; }

  .finish { display: none; flex-direction: column; align-items: center; flex: 1;
            min-height: 0; text-align: center; overflow-y: auto; }
  .finish-main { display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
                 width: 100%; padding: 1rem .5rem; }
  .finish-main>div, .finish-main>h2, .finish-main>p { flex-shrink: 0; }
  .finish-actions { flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
                    width: 100%; padding: .4rem .5rem .8rem; }
  .finish .ring { width: 116px; height: 116px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                  margin: 0 0 .5rem; flex-shrink: 0; }
  .finish .ring b { font-size: 1.9rem; font-variant-numeric: tabular-nums; }
  .finish h2 { font-size: 1.3rem; margin: 0; }
  .finish .sub { color: var(--muted); margin: .1rem 0 .7rem; font-size: .9rem; }
  .finish .rows { width: 100%; max-width: 260px; margin: 0 0 .5rem; text-align: left; }
  .finish .rows .row { display: flex; justify-content: space-between; align-items: center; padding: .4rem 0;
                       border-bottom: 1px solid var(--line); line-height: 1.2; }
  .finish .rows .row b { font-variant-numeric: tabular-nums; }
  .finish .rows .row.g b { color: var(--green); }
  .finish .rows .row.n b { color: var(--red); }
  .finish .block { width: 100%; max-width: 260px; margin: .25rem 0; flex-shrink: 0; }
  .finish .answers { width: 100%; max-width: 320px; text-align: left; margin: .4rem 0; }
  .finish .ans-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
                       font-weight: 700; margin-bottom: .4rem; }
  .finish .ans-row { font-size: .82rem; padding: .45rem .5rem; border-radius: 8px; margin-bottom: .3rem;
                     background: var(--panel); border: 1px solid var(--line); line-height: 1.35; }
  .finish .ans-row b { font-variant-numeric: tabular-nums; }
  .finish .ans-row.ok b { color: var(--green); }
  .finish .ans-row.wrong b { color: var(--red); }
  .finish .ans-row .mistake { color: var(--red); font-size: .75rem; font-weight: 700; text-transform: uppercase;
                              letter-spacing: .3px; margin-left: .2rem; }
  .finish .ans-ok { padding: .5rem; color: var(--green); font-weight: 600; font-size: .9rem; }
  .finish .ans-item { cursor: pointer; transition: border-color .15s; }
  .finish .ans-item:hover { border-color: var(--accent); }
  .finish .ans-q { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .finish .ans-q .chevron { color: var(--muted); font-size: .8rem; flex-shrink: 0; }
  .finish .ans-body-wrap { margin-top: .45rem; padding-top: .45rem; border-top: 1px dashed var(--line); }
  .finish .ans-body { font-size: .82rem; line-height: 1.5; color: var(--ink); text-align: left; }
  .finish .ans-body p { margin: 0 0 .4rem; }
  .finish .ans-body b { color: var(--accent); }

  @media (min-width: 700px) .card-wrap { max-height: 540px; }
</style>
</head>
<body>
<main>

  <!-- ======= ГЛАВНОЕ МЕНЮ ======= -->
  <section class="screen" id="menuScreen">
    <div class="menu-wrap">
      <h1 class="menu-title">Флеш-карточки</h1>
      <button class="close" id="closeApp" title="Скрыть">✕</button>
      <div class="theme-list" id="themeList"></div>
      <p class="swipe-note">↺ свайп вправо = «знаю» · влево = «не знаю»</p>
    </div>
  </section>

  <!-- ======= ИЗУЧЕНИЕ ======= -->
  <section class="screen hidden" id="studyScreen">
    <header>
      <button class="back" id="btnBack" title="В меню">‹</button>
      <h1 id="studyTitle">Тема</h1>
      <button class="close" id="closeStudy" title="В меню">✕</button>
    </header>
    <div class="topbar">
      <div class="progress" id="progBar"><div class="prog-segs" id="progSegs"></div></div>
      <div class="progress-num" id="progNum"></div>
    </div>
    <div class="stage">
      <div class="counter" id="counter"></div>
      <div class="card-wrap" id="cardWrap">
        <div class="swipe-hint"><span class="yes">знаю</span><span class="no">не знаю</span></div>
        <div class="card" id="card0"></div>
      </div>
      <div class="actions" id="actions">
        <button class="btn no" id="btnNo">✗ Не знаю</button>
        <button class="btn flip-c" id="btnFlip">Перевернуть</button>
        <button class="btn yes" id="btnYes">✓ Знаю</button>
      </div>
      <div class="finish" id="finish">
        <div class="finish-main">
          <div class="ring" id="ring"><b>0%</b></div>
          <h2 id="finishTitle">Колода пройдена</h2>
          <p id="finishSub"></p>
          <div class="rows" id="rows"></div>
          <div class="answers" id="answers" style="display:none"></div>
        </div>
        <div class="finish-actions">
          <button class="btn block" id="restart">Пройти ещё раз</button>
          <button class="btn block" id="review">Незнакомые ещё раз</button>
          <button class="btn block" id="toMenu">← В меню</button>
        </div>
      </div>
    </div>
  </section>

<script>
/* ============================================================
   ДАННЫЕ ПО ТЕМАМ.
   Чтобы добавить новую тему из нового PDF: продублируй блок и
   впиши в cards массив объектов {cat, term, back:[...] }.
   ============================================================ */
const THEMES = {
  "Человек как биосоциальное существо. Личность": { verdict: false, labelYes: "знаю", labelNo: "не знаю", cards: [
    { cat: "Термины", term: "Дайте определение термину «человек»", back: ["Человек — биосоциальное существо, обладающее даром мышления и речи, способностью создавать орудия труда и пользоваться ими в процессе общественного производства."] },
    { cat: "Термины", term: "Дайте определение термину «индивид»", back: ["Индивид — единичный представитель человеческого рода, отличающийся от других биологическими особенностями и психологическими свойствами."] },
    { cat: "Термины", term: "Дайте определение термину «индивидуальность»", back: ["Индивидуальность — единство неповторимых личностных свойств конкретного человека, которые отличают его от всех других."] },
    { cat: "Термины", term: "Дайте определение термину «личность»", back: ["Личность — совокупность социально значимых качеств, черт, свойств человека.<br>Формируется в процессе усвоения социальных норм, образцов и культуры общества.<br>Индивидом рождаются — личностью становятся."] },
    { cat: "Человек", term: "Биологические черты человека", back: ["Темперамент", "Рефлексы", "Биологические потребности", "Анатомия и физиология", "Наличие задатков", "Особенности нервной системы", "Эмоции", "Приспособление к условиям среды"] },
    { cat: "Человек", term: "Социальные черты (отличия от животного)", back: ["Обладает мышлением, сознанием и членораздельной речью", "Создаёт сложные орудия труда и пользуется ими в общественном производстве", "Целенаправленная, в т.ч. творческая деятельность", "Наличие социальных и духовных потребностей"] },
    { cat: "Человек", term: "Приведите примеры единства биологических и социальных черт в человеке", back: ["Влияние наследственности на физические данные и психические свойства", "Борьба общества с наследственными заболеваниями", "Удовлетворение биологических потребностей в рамках социальных норм", "Развитие природных задатков в деятельности"] },
    { cat: "Гипотезы происхождения", term: "Религиозная гипотеза", back: ["У мира есть создатель — Бог. Человек создан по образу и подобию Божьему."] },
    { cat: "Гипотезы происхождения", term: "Теория эволюции (материалистическая)", back: ["Вселенная возникла в результате «Большого взрыва», белковая жизнь зародилась в океане. Венцом эволюции стал современный человек, сформировавшийся в конкуренции видов приматов."] },
    { cat: "Гипотезы происхождения", term: "Гипотеза внешнего вмешательства", back: ["Жизнь на Земле образовалась в результате инопланетного вмешательства."] },
    { cat: "Социализация", term: "дайте определение термину «социализация»", back: ["Социализация — это процесс усвоения человеком социальных ролей, норм и ценностей.<br>Осуществляется на протяжении всей жизни.<br>Результат — формирование личности."] },
    { cat: "Социализация", term: "Характер протекания социализации", back: ["<span class='k'>Стихийный</span> — при решении обычных жизненных задач.", "<span class='k'>Целенаправленный</span> — во время воспитания и обучения."] },
    { cat: "Социализация", term: "Виды социализации", back: ["Первичная и вторичная."] },
    { cat: "Социализация", term: "Первичная социализация", back: ["<span class='k'>Когда:</span> младенчество, детство, юность; завершается в момент значимых жизненных событий.", "<span class='k'>Что:</span> усвоение элементарных правил поведения и навыков общения.", "<span class='k'>Кто:</span> семья и ближайшее окружение.", "<span class='k'>Пример:</span> ребёнок учится говорить, этикету, общению с братьями и сёстрами."] },
    { cat: "Социализация", term: "Вторичная социализация", back: ["<span class='k'>Когда:</span> вся дальнейшая жизнь, периоды изменений и адаптации личности.", "<span class='k'>Что:</span> адаптация к новым условиям, освоение новых ролей и норм.", "<span class='k'>Кто:</span> соц. институты — образование, трудовые коллективы, СМИ, государство.", "<span class='k'>Пример:</span> студент осваивает нормы вуза; переезд в другую страну."] },
    { cat: "Социализация", term: "Факторы социализации", back: ["Окружение", "Культурная среда", "Политическая система"] },
    { cat: "Социализация", term: "Функции социализации", back: ["Приобретение социокультурного опыта", "Усвоение социальных ролей", "Формирование системы ценностей"] },
    { cat: "Социализация", term: "Десоциализация", back: ["Процесс отказа или утраты усвоенных норм, культурных образцов, социального статуса и ценностей."] },
    { cat: "Социализация", term: "Ресоциализация", back: ["Процесс повторной социализации, в результате которого восстанавливаются утраченные либо усваиваются новые нормы и ценности."] },
    { cat: "Агенты", term: "Агенты социализации", back: ["Люди, группы, учреждения и организации, ответственные за воспитание и обучение социальным нормам, освоение ролей, формирование ценностных ориентиров."] },
    { cat: "Агенты", term: "Агенты первичной социализации", back: ["Институты и люди ближайшего окружения с наибольшим влиянием.<br>Семья, одноклассники, сверстники, друзья, родственники, соседи."] },
    { cat: "Агенты", term: "Агенты вторичной социализации", back: ["Институты, помогающие осваивать новые нормы на поздних этапах.<br>Государство, СМИ, политические партии, трудовой коллектив, религиозные организации."] },
    { cat: "Организации РФ", term: "3 организации РФ, оказывающие социализирующее воздействие на их участников", back: ["<span class='k'>1. «Движение Первых»</span> — объединяет детей и молодёжь; участником может стать любой ребёнок или подросток, обучающийся по программам начального, основного, среднего общего, среднего профессионального и высшего образования (заявка — самостоятельно или с родителями на сайте).",
       "<span class='k'>2. Ассоциация «Добро.РФ»</span> — крупнейший координатор волонтёрского движения; образовательные проекты, всероссийские акции, культура благотворительности; волонтёр — с 8 лет (с согласия родителей), с 14 лет самостоятельно.",
       "<span class='k'>3. Российское общество «Знание»</span> — с 1947 г.; просветительская работа: бесплатные лекции, воспитательные мероприятия, образовательный контент в интернете.",
       "<span class='k'>4. Русское географическое общество</span> — основано в 1845 г.; изучение страны, сохранение природных богатств, экспедиции, выставки, фотоконкурс «Самая красивая страна».",
       "<span class='k'>5. Поисковое движение России</span> — с 1950-х гг., общероссийское с 2013 г.; 1,5 тыс. отрядов, 45 тыс. поисковиков; поиск в местах ВОВ, архивы, помощь родственникам, уход за захоронениями, книги памяти."] }
  ]},

  "Мировоззрение. Деятельность. Потребности": {
    verdict: false, labelYes: "знаю", labelNo: "не знаю",

      { cat: "Функции науки", term: "Прогностическая функция науки", back: ["Составление научно-обоснованных прогнозов изменений в природе и обществе.<br>Пример: учёные предложили прогноз развития ИИ: в будущем он трансформируется к диагностике и лечению заболеваний и сможет ускорить создание новых препаратов в 5–10 раз."] },
      { cat: "Функции науки", term: "Образовательная (просветительская) функция науки", back: ["Повышение уровня образования населения, решающее влияние на учебно-воспитательный процесс, совершенствование образовательных программ.<br>Пример: на уроках физики школьники разбирают законы Ньютона, Архимедовой силы — это повышает уровень образования населения."] },
      { cat: "Функции науки", term: "Социальная функция науки", back: ["Наука меняет условия жизни общества, делая их более комфортными.<br>Пример: Фарадей обнаружил, что провод рядом с магнитом вращается при прохождении тока — это привело к разработке электродвигателя, облегчившего быт людей."] },
      { cat: "Функции науки", term: "Почему происходит интеграция наук в современном мире? (№25)", back: ["Возникающие в обществе проблемы по отдельности не может решить практически ни одна из существующих наук, поэтому необходима «коммуникация» специалистов — представителей различных наук.", "Знания становятся всё сложнее, поэтому они должны рассматриваться комплексно, с разных сторон, что также приводит к интеграции наук."] },

      { cat: "Научное познание", term: "Особенности научного познания", back: ["Научное знание не зависит от качеств и мнений познающего субъекта (объективность)", "Эмпирические данные приобретают научный характер только тогда, когда включаются в систему теоретических положений", "Элементы научного знания выстраиваются в систему взаимосвязанных положений (системность)", "Если знание не может быть проверено другими исследователями, оно не может быть включено в систему научных знаний (проверяемость)", "Любые теоретические положения должны быть обоснованы (доказательность)", "В научном познании используется особый понятийный аппарат (язык науки)"] },
      { cat: "Научное познание", term: "Уровни научного познания", back: ["<span class='k'>Эмпирический:</span> объект изучения отражается со стороны, доступной наблюдению; учёный взаимодействует с ним непосредственно или с помощью приборов.", "<span class='k'>Теоретический:</span> имеет дело с логической моделью объекта изучения, выраженной научным языком."] },

      { cat: "Методы научного познания", term: "Дайте определение термину «гипотеза»", back: ["Гипотеза — предположение (догадка), с помощью которого учёные стремятся объяснить эмпирические факты, ещё не нашедшие объяснения в науке.", "В ходе проверки гипотеза может: опровергаться, уточняться, утверждаться в качестве научной теории."] },
      { cat: "Методы научного познания", term: "Дайте определение термину «метод научного познания»", back: ["Метод научного познания — совокупность приёмов и способов, при помощи которых приобретаются объективные, систематически организованные и обоснованные знания о природе, человеке и обществе."] },
      { cat: "Методы научного познания", term: "Эмпирические методы научного познания", back: ["<span class='k'>Наблюдение</span> — изучение объекта в его естественной среде без влияния на происходящие процессы.", "<span class='k'>Измерение</span> — получение численных характеристик объекта и сравнение его свойства с образцовыми значениями.", "<span class='k'>Эксперимент</span> — намеренное создание особых условий и дальнейшее изучение объекта в данных условиях."] },
      { cat: "Методы научного познания", term: "Наблюдение (эмпирический метод)", back: ["Изучение объекта в его естественной среде без влияния на происходящие процессы.<br>Пример: учёный-орнитолог наблюдает за перемещением перелётных птиц, определяя направления их движения."] },
      { cat: "Методы научного познания", term: "Измерение (эмпирический метод)", back: ["Получение численных характеристик объекта и сравнение его свойства с образцовыми значениями.<br>Пример: Паскаль измерил высоту ртутного столба у подножия горы и на вершине и сделал вывод о существовании атмосферного давления."] },
      { cat: "Методы научного познания", term: "Эксперимент (эмпирический метод)", back: ["Намеренное создание особых условий и дальнейшее изучение объекта в данных условиях.<br>Пример: Ньютон пропустил солнечный луч через призму и наблюдал «радугу» — это доказало явление дисперсии света."] },
      { cat: "Методы научного познания", term: "Методы теоретического уровня познания (классификация, систематизация, описание, сравнение)", back: ["<span class='k'>Классификация</span> — объединение изучаемых объектов в группы по одинаковым свойствам.", "<span class='k'>Систематизация</span> — объединение накопленных знаний в систему, где обозначены взаимосвязи и закономерности (пример: периодическая система Менделеева).", "<span class='k'>Описание</span> — фиксация сведений об объектах и данных наблюдения с помощью языка.", "<span class='k'>Сравнение</span> — сопоставление свойств изучаемого объекта со свойствами других объектов."] },
      { cat: "Методы научного познания", term: "Анкетирование (эмпирический метод)", back: ["Сбор данных.<br>Пример: ВЦИОМ провёл опрос среди населения страны и определил отношение россиян к пятидневной рабочей неделе."] },
      { cat: "Методы научного познания", term: "Методы теоретического уровня познания (идеализация, дедукция)", back: ["<span class='k'>Идеализация</span> — создание образа вымышленного объекта с идеальными свойствами как особого примера (пример: идеальная модель свободного падения тел Галилея).", "<span class='k'>Дедукция</span> — умозаключения, направленные от общего к частному (пример: если сумма углов треугольника равна 180°, то и в определённом треугольнике углы дадут 180°)."] },
      { cat: "Методы научного познания", term: "Теоретические методы: абстрагирование, конкретизация, формализация", back: ["<span class='k'>Абстрагирование</span> — изучение предмета под новым углом, с акцентом на одни свойства и игнорированием других.", "<span class='k'>Конкретизация</span> — переход от абстрактных и односторонних представлений к более конкретному воспроизведению явления в теоретическом мышлении.", "<span class='k'>Формализация</span> — построение абстрактных математических моделей, раскрывающих сущность изучаемых процессов."] },
      { cat: "Методы научного познания", term: "Индукция (теоретический метод)", back: ["Умозаключения, направленные от частного к общему.<br>Пример: Мендель на основе множества наблюдений сформулировал общие законы наследственности."] },
      { cat: "Методы научного познания", term: "Аналогия (теоретический метод)", back: ["Приём познания, при котором на основании сходства объектов в одних признаках заключают об их сходстве и в других признаках.<br>Пример: Белл перенёс принцип работы внутренних органов уха на колебания мембраны и разработал телефон."] },
      { cat: "Методы научного познания", term: "Анализ (теоретический метод)", back: ["Деление объекта на составляющие и подробное изучение каждой из них.<br>Пример: экономисты провели анализ ВВП, инфляции, безработицы и других индикаторов, чтобы сделать вывод об экономическом росте."] },
      { cat: "Методы научного познания", term: "Синтез (теоретический метод)", back: ["Воссоздание целостной картины из отдельных деталей.<br>Пример: психолог объединил отдельные качества человека, чтобы сделать вывод о его личности."] },
      { cat: "Методы научного познания", term: "Эмпирические и теоретические методы (полный список к №19)", back: ["<span class='k'>Эмпирические:</span> наблюдение, измерение, эксперимент, описание, классификация, анкетирование, сбор и запись опытных данных, фактов.", "<span class='k'>Теоретические:</span> систематизация, сравнение, идеализация, абстрагирование, конкретизация, формализация, анализ, синтез, индукция, дедукция, аналогия, выдвижение гипотез, создание логической модели."] },

      { cat: "Социальное познание", term: "Методы социального познания", back: ["<span class='k'>Социальный опрос</span> (анкетирование) — проведение социального опроса населения.", "<span class='k'>Социальный эксперимент</span> — изучение поведения людей в заранее определённых условиях.", "<span class='k'>Наблюдение</span> (социометрия) — выявление и описание межличностных отношений в группе.", "<span class='k'>Экспертный метод</span> — метод, основанный на мнении экспертов в конкретной области.", "<span class='k'>Социальное прогнозирование</span> — предвидение тенденций и перспектив возможного развития социальных систем."] },
      { cat: "Социальное познание", term: "Социальное прогнозирование", back: ["Предвидение тенденций и перспектив возможного развития социальных систем, объектов, общественных явлений.<br>Пример: учёные оценили предполагаемое изменение численности населения и возрастной структуры для планирования пенсионного обеспечения."] },
      { cat: "Социальное познание", term: "Роль науки в современном обществе", back: ["Оказывает влияние на самого человека, формирует картину мира, постоянно дополняя и уточняя её детали", "Формирует научное мировоззрение как основу рационального отношения к действительности", "Научные данные активно используются для решения глобальных проблем и развития производства", "Гражданская позиция авторитетных в научном сообществе людей влияет на общественное мнение"] },

      { cat: "НТП", term: "Дайте определение термину «научно-технический прогресс»", back: ["Научно-технический прогресс — непрерывный процесс внедрения новой техники и технологий, организации производства и труда на основе достижений научных знаний."] },
      { cat: "НТП", term: "Признаки НТП", back: ["Разработка и широкое использование принципиально новых машин и систем машин, работающих в автоматическом режиме", "Создание и развитие качественно новых технологий", "Открытие и внедрение новых видов источников энергии, использование новых видов материалов", "Широкое развитие автоматизации производственных процессов"] },
      { cat: "НТП", term: "Примеры научно-технологического прогресса в России", back: ["В медицине применяются роботы-симуляторы для обучения хирургов", "Кластер «Биомед» в Сколково — площадка для развития биотехнологических проектов", "Наночастицы серебра, полученные в результате облучения, эффективно уничтожают раковые клетки", "В центре им. Хруничева создан космический ракетный комплекс «Ангара»", "Сбер использует ИИ для оценки вероятности увольнений при приёме на работу"] },

      { cat: "Поддержка науки в РФ", term: "Поддержка науки в РФ", back: ["<span class='k'>Президентские стипендии</span> для молодых учёных — поддержка аспирантов, проводящих исследования в рамках приоритетов научно-технологического развития РФ.", "<span class='k'>Грантовая поддержка</span> — гранты на покупку оборудования отечественного производства.", "<span class='k'>Техническая поддержка</span> — программа «Приоритет 2030»: создание более 100 современных университетов — центров научно-технологического развития страны."] },
      { cat: "Поддержка науки в РФ", term: "Приоритеты научно-технологического развития России (Указ Президента РФ)", back: ["Переход к цифровым производственным технологиям и роботизированным системам", "Переход к экологически чистой и ресурсосберегающей энергетике", "Переход к высокотехнологичному здравоохранению", "Переход к высокопродуктивному и экологически чистому сельскому хозяйству", "Создание транспортных и телекоммуникационных систем, обеспечивающих связь территории России"] },
      { cat: "Поддержка науки в РФ", term: "Российские научные организации по приоритетам (№19, №25.3)", back: ["<span class='k'>Экологически чистая энергетика:</span> Курчатовский институт — первая в мире промышленная атомная электростанция.", "<span class='k'>Высокотехнологичное здравоохранение:</span> центр онкологии им. Блохина разработал лечение против вируса папилломы человека, снизив заболеваемость раком.", "<span class='k'>Агрохозяйство:</span> Российская академия наук участвовала в разработке спутниковых технологий изучения Земли и прогнозирования климата — это позволяет перейти к экологическому земледелию."] },

      { cat: "Деятели наук — естественные", term: "Назовите 3 отечественных деятелей естественных наук", hint: "Фамилия + наука + достижение", back: ["1. <span class='k'>Иван Петрович Павлов</span> — физиолог, лауреат Нобелевской премии. Исследовал условные рефлексы на примере собак; его открытия легли в основу поведенческой терапии.",
       "2. <span class='k'>Дмитрий Иванович Менделеев</span> — химик. Открыл периодический закон химических элементов, упорядочив элементы по атомной массе и предсказав свойства ещё не открытых элементов.",
       "3. <span class='k'>Николай Иванович Пирогов</span> — врач, основоположник применения анестезии в России; ввёл в практику эфирную анестезию, что повысило безопасность хирургических операций."] },
      { cat: "Деятели наук — естественные", term: "Назовите 3 деятелей естественных наук: Сахаров, Попов, Оганесян, Соболев, Логунов", hint: "Фамилия + наука + достижение", back: ["1. <span class='k'>Андрей Дмитриевич Сахаров</span> — физик-теоретик, один из разработчиков водородной бомбы; его работы по термоядерному синтезу внесли вклад в ядерную физику.",
       "2. <span class='k'>Александр Степанович Попов</span> — физик. Изобрёл радио, создал первый в мире радиоприёмник, разработал основы радиолокации и радионавигации.",
       "3. <span class='k'>Юрий Оганесян</span> — химик, руководитель открытия сверхтяжёлых элементов (№118 — оганесон); его исследования расширяют периодическую таблицу."] },
      { cat: "Деятели наук — технические и точные", term: "Назовите 3 отечественных деятелей точных и технических наук", hint: "Фамилия + наука + достижение", back: ["1. <span class='k'>Сергей Павлович Королёв</span> — космонавтика. Ключевая фигура в ракетостроении; создал первый спутник Земли, под его руководством осуществлён первый полёт человека в космос.",
       "2. <span class='k'>Николай Иванович Лобачевский</span> — математик. Основоположник неевклидовой геометрии, расширившей представления о пространстве.",
       "3. <span class='k'>Евгений Иванович Юревич</span> — робототехника. Главный конструктор государственных программ по робототехнике; под его руководством созданы сложные роботы с элементами ИИ для работ в экстремальных условиях, включая ликвидацию последствий аварии на Чернобыльской АЭС."] },
      { cat: "Деятели наук — технические и точные", term: "Назовите 3 современных деятелей технических и точных наук РФ", hint: "Фамилия + наука + достижение", back: ["1. <span class='k'>Сергей Киселёв</span> — прикладная информатика. Система ИИ для беспилотников под российские дороги и климат; снижение аварийности при тестировании.",
       "2. <span class='k'>Ирина Васильева</span> — биоинженерия. Инновационные биосенсоры на основе наноматериалов для быстрой диагностики инфекций (COVID-19) за 15 минут.",
       "3. <span class='k'>Григорий Перельман</span> — математика. Доказал гипотезу Пуанкаре (топология) — одну из самых значимых задач математики, проливающую свет на устройство Вселенной."] },
      { cat: "Деятели наук — социально-гуманитарные", term: "Назовите 3 отечественных деятелей социально-гуманитарных наук", hint: "Фамилия + наука + достижение", back: ["1. <span class='k'>Лев Семёнович Выготский</span> — психолог. Создал теорию социального конструктивизма; ввёл понятие зоны ближайшего развития — основу современных методик обучения.",
       "2. <span class='k'>Лев Николаевич Гумилёв</span> — историк. Разработал концепцию пассионарности (внутренней энергии общества); раскрыл закономерности в развитии культур и цивилизаций.",
       "3. <span class='k'>Николай Дмитриевич Кондратьев</span> — экономист. Создал теорию экономических циклов («циклы Кондратьева»); знание о рыночной цикличности помогает бороться с кризисами."] },
      { cat: "Деятели наук — социально-гуманитарные", term: "Назовите 3 современных деятелей социально-гуманитарных наук РФ", hint: "Фамилия + наука + достижение", back: ["1. <span class='k'>Ирина Прохорова</span> — культуролог. Исследовала влияние современной массовой культуры на формирование идентичности молодёжи; показала, как новые медиа меняют культурные практики.",
       "2. <span class='k'>Андрей Хуторской</span> — педагог. Разработал инновационные методы обучения, направленные на развитие критического мышления у школьников.",
       "3. <span class='k'>Сергей Алексеев</span> — правовед, член-корреспондент РАН. Возглавлял группу юристов, подготовивших президентский проект Конституции РФ; один из авторов Гражданского кодекса РФ."] },

      { cat: "ЕГЭ №19", term: "Назовите 3 признака научного познания и проиллюстрируйте их примерами", back: ["1) <span class='k'>Объективность</span> — научное знание не зависит от качеств и мнений познающего субъекта. Пример: учёные-химики отметили, что вещества состоят из молекул; это знание соответствует реальной действительности и объективно.",
       "2) <span class='k'>Особый «язык науки»</span> — в научном познании используется особый понятийный аппарат. Пример: экономист использовал понятия «издержки», «амортизация», «сдельная заработная плата».",
       "3) <span class='k'>Системность</span> — элементы знания выстраиваются в систему взаимосвязанных положений. Пример: орнитолог объединил все факты о птицах, выстроив систему знаний об их строении, цикле жизни, перемещениях."] },
      { cat: "ЕГЭ №19", term: "Назовите 3 функции науки и проиллюстрируйте их примерами", back: ["1) <span class='k'>Познавательная:</span> благодаря научным исследованиям доказано, что Земля вращается вокруг Солнца; это знание повлияло на представления общества об устройстве Солнечной системы.",
       "2) <span class='k'>Прогностическая:</span> учёные доказали, что на Марсе может существовать жизнь — это позволяет выстроить прогноз на будущие исследования.",
       "3) <span class='k'>Мировоззренческая:</span> Вася на уроках биологии сформировал научное мировоззрение: придерживается теории эволюции и считает, что человек произошёл от общего с обезьяной предка."] }
    ]
  }
};

/* ---------- ссылки ---------- */
const $ = id => document.getElementById(id);
const menuScreen = $("menuScreen"), studyScreen = $("studyScreen");
const themeList = $("themeList");
const cardEl = $("card0"), wrapEl = $("cardWrap");
const progSegs = $("progSegs"), progNum = $("progNum"), counterEl = $("counter");

/* ---------- состояние ---------- */
let currentTheme = null;
let deck = [], idx = 0;
let stats = { seen: 0, yes: 0, no: 0, noIdxs: [] };
let dragging = false, startX = 0, currentX = 0, moved = false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- МЕНЮ ---------- */
function getProgress(){ try { return JSON.parse(localStorage.getItem("flashcards_progress")||"{}"); } catch(e){ return {}; } }
function saveProgress(){ try { localStorage.setItem("flashcards_progress", JSON.stringify(progress)); } catch(e){} }
const progress = getProgress();

function themePercent(name){
  const p = progress[name];
  const total = THEMES[name].cards.length;
  if(!p || !p.seen) return 0;      // not studied yet = 0%
  return Math.min(100, Math.round(p.yes/total*100));
}

function renderMenu(){
  const names = Object.keys(THEMES);
  themeList.innerHTML = names.map((name,i)=>{
    const t = THEMES[name];
    const pct = themePercent(name);
    const percHtml = `<div class="t-perc ${pct>=80?"done":""}">${pct}%</div>`;
    const progLine = `<span>${t.cards.length} карточек</span>`;
    return `
    <button class="theme" data-name="${esc(name)}">
      <div class="tnum">${i+1}</div>
      <div class="tinfo">
        <b>${esc(name)}</b>
        ${progLine}
      </div>
      ${percHtml}
      <div class="arrow">›</div>
    </button>`;
  }).join("");
  themeList.querySelectorAll(".theme").forEach(t=>t.addEventListener("click",()=>{
    openTheme(t.dataset.name);
  }));
}

/* ---------- ИЗУЧЕНИЕ ---------- */
function openTheme(name){
  currentTheme = name;
  const t = THEMES[name];
  $("studyTitle").textContent = name;
  $("btnNo").textContent = "✗ " + (t.labelNo || "Не знаю");
  $("btnYes").textContent = "✓ " + (t.labelYes || "Знаю");
  document.querySelector(".swipe-hint .no").textContent = t.labelNo || "не знаю";
  document.querySelector(".swipe-hint .yes").textContent = t.labelYes || "знаю";
  counterEl.dataset.yes = t.labelYes || "знаю";
  counterEl.dataset.no = t.labelNo || "не знаю";
  menuScreen.classList.add("hidden");
  studyScreen.classList.remove("hidden");
  loadDeck(t.cards.map((_,i)=>i));
}
function toMenu(){
  studyScreen.classList.add("hidden");
  menuScreen.classList.remove("hidden");
  currentTheme = null;
  renderMenu();
}
function loadDeck(idxs){
  deck = shuffle([...idxs]);
  stats = { seen: 0, yes: 0, no: 0, noIdxs: [] };
  idx = 0;
  $("finish").style.display = "none";
  $("actions").style.display = "flex";
  wrapEl.style.display = "block";   // вернуть область карточки
  cardEl.style.transition = "none";
  resetProgBar();
  renderCard();
  updateTop();
}
function renderCard(){
  if (idx >= deck.length){ finish(); return; }
  const c = THEMES[currentTheme].cards[deck[idx]];
  const tv = THEMES[currentTheme];
  cardEl.classList.remove("flipped");
  const backHtml = tv.verdict
    ? `<div class="def"><p class="verdict-hint">Ответ узнаешь в конце.</p></div>`
    : `<div class="def">${c.back.map(b=>`<p>${b}</p>`).join("")}</div>`;
  cardEl.innerHTML = `
    <div class="inner">
      <div class="face front">
        <div class="cat">${esc(c.cat)}</div>
        <div class="term">${esc(c.term)}</div>
        ${c.hint ? `<div class="card-hint">${c.hint}</div>` : ""}
        <div class="tap-hint">нажми, чтобы перевернуть</div>
      </div>
      <div class="face back">
        <div class="cat">${tv.verdict ? "Оцени себя" : "Определение"}</div>
        ${backHtml}
      </div>
    </div>`;
  cardEl.style.transition = "transform .6s cubic-bezier(.2,.8,.2,1)";
  cardEl.style.transform = "translateX(0) rotate(0deg)";
  cardEl.style.opacity = "1";
  counterEl.textContent = `Карточка ${idx+1} из ${deck.length}`;
}
function flip(){ cardEl.classList.toggle("flipped"); }

function onDown(e){ dragging=true; startX=e.clientX; moved=false; cardEl.style.transition="none";
  try{ cardEl.setPointerCapture(e.pointerId); }catch(_){} }
function onMove(e){ if(!dragging) return; currentX = e.clientX - startX; moved = Math.abs(currentX)>5;
  cardEl.style.transform = `translateX(${currentX}px) rotate(${currentX*0.06}deg)`;
  showHint(currentX); }
function onUp(){ if(!dragging) return; dragging=false;
  const th = wrapEl.clientWidth*0.35;
  if (currentX > th) decide("yes");
  else if (currentX < -th) decide("no");
  else { cardEl.style.transition="transform .3s"; cardEl.style.transform="translateX(0) rotate(0deg)"; }
  hideHint(); currentX=0; }
function showHint(x){ const no=document.querySelector(".swipe-hint .no"), yes=document.querySelector(".swipe-hint .yes");
  no.style.opacity = x<-20 ? Math.min(1, -x/200) : 0;
  yes.style.opacity = x>20 ? Math.min(1, x/200) : 0; }
function hideHint(){ document.querySelectorAll(".swipe-hint span").forEach(s=>s.style.opacity=0); }

let busy = false;
function decide(dir){
  if (idx >= deck.length || busy) return;
  busy = true;
  stats.seen++;
  const ok = dir==="yes";
  if (ok) stats.yes++; else { stats.no++; stats.noIdxs.push(deck[idx]); }
  addProgSegment(ok);
  // live-save progress to menu (current run, % of "known" cards)
  progress[currentTheme] = { seen: stats.seen, yes: stats.yes };
  saveProgress();
  const fly = ok ? wrapEl.clientWidth : -wrapEl.clientWidth;
  hideHint();
  cardEl.style.transition = "transform .45s cubic-bezier(.5,-.2,.7,.3), opacity .45s";
  cardEl.style.transform = `translateX(${fly*1.4}px) rotate(${ok?12:-12}deg)`;
  cardEl.style.opacity = "0";
  updateTop();
  setTimeout(()=>{ idx++; busy=false; renderCard(); }, 420);
}
function resetProgBar(){
  progSegs.innerHTML = "";
}
function addProgSegment(ok){
  const d = document.createElement("div");
  d.className = "seg " + (ok ? "ok" : "bad");
  d.style.flex = "0 0 " + (100/(deck.length||1)) + "%";
  progSegs.appendChild(d);
}
function updateTop(){
  progNum.textContent = `${stats.seen}/${deck.length}`;
}
function finish(){
  $("actions").style.display = "none";
  counterEl.textContent = "";
  cardEl.innerHTML = "";
  wrapEl.style.display = "none";   // скрыть пустую область карточки
  const f = $("finish");
  const pct = Math.round(stats.seen ? stats.yes/stats.seen*100 : 0);
  const ring = $("ring");
  ring.style.background = `conic-gradient(${pct>=60?"var(--green)":"var(--red)"} ${pct}%, var(--panel) ${pct}%)`;
  ring.querySelector("b").textContent = pct+"%";
  $("finishTitle").textContent = pct>=80 ? "Отлично!" : pct>=50 ? "Хорошо" : "Стоит повторить";
  const t = THEMES[currentTheme];
  const lY = t ? (t.labelYes||"знаю") : "знаю";
  const lN = t ? (t.labelNo||"не знаю") : "не знаю";
  $("finishSub").className = "sub";
  $("finishSub").textContent = lY.charAt(0).toUpperCase()+lY.slice(1) + " " + stats.yes + " · " + lN.charAt(0).toUpperCase()+lN.slice(1) + " " + stats.no + " · Всего " + stats.seen;
  $("rows").innerHTML = `
    <div class="row g"><span>${lY.charAt(0).toUpperCase()+lY.slice(1)}</span><b>${stats.yes}</b></div>
    <div class="row n"><span>${lN.charAt(0).toUpperCase()+lN.slice(1)}</span><b>${stats.no}</b></div>
    <div class="row"><span>Всего пройдено</span><b>${stats.seen}</b></div>`;
  const ans = $("answers");
  ans.style.display = "block";
  if (stats.noIdxs.length > 0){
    // единый формат во всех темах: ошибочные вопросы с раскрытием ответа по клику
    ans.innerHTML = `<div class="ans-title">Вопросы, где была ошибка (${stats.noIdxs.length}) — нажми, чтобы увидеть ответ</div>` +
      stats.noIdxs.map((cardIdx,i)=>{
        const cc = t.cards[cardIdx];
        const answerHtml = t.verdict
          ? `<div class="ans-body"><b>Правильный ответ:</b> ${cc.answer ? "верно" : "неверно"}</div>`
          : `<div class="ans-body">${Array.isArray(cc.back) ? cc.back.map(b=>`<p>${b}</p>`).join("") : esc(cc.back)}</div>`;
        return `<div class="ans-row wrong ans-item" data-i="${i}">
          <div class="ans-q">${i+1}. ${esc(cc.term)} <span class="chevron">▸</span></div>
          <div class="ans-body-wrap" style="display:none">${answerHtml}</div>
        </div>`;
      }).join("");
  } else {
    ans.innerHTML = `<div class="ans-title">Вопросы, где была ошибка</div><div class="ans-ok">Ошибок нет — всё верно! 🎉</div>`;
  }
  progress[currentTheme] = { seen: stats.seen, yes: stats.yes };
  saveProgress();
  f.style.display = "flex";
}

/* ---------- события ---------- */
document.addEventListener("DOMContentLoaded", ()=>{
  renderMenu();
  $("btnBack").addEventListener("click", toMenu);
  $("closeStudy").addEventListener("click", toMenu);
  $("closeApp").addEventListener("click", ()=> document.body.style.visibility="hidden");
  $("btnNo").addEventListener("click", ()=>decide("no"));
  $("btnYes").addEventListener("click", ()=>decide("yes"));
  $("btnFlip").addEventListener("click", flip);
  $("restart").addEventListener("click", ()=>loadDeck(THEMES[currentTheme].cards.map((_,i)=>i)));
  $("review").addEventListener("click", ()=>loadDeck(stats.noIdxs));
  $("toMenu").addEventListener("click", toMenu);

  // клик по ошибке — раскрыть правильный ответ
  document.addEventListener("click", (e)=>{
    const item = e.target.closest(".ans-item");
    if(!item) return;
    const body = item.querySelector(".ans-body-wrap");
    const ch = item.querySelector(".chevron");
    const open = body.style.display !== "none";
    body.style.display = open ? "none" : "block";
    if(ch) ch.textContent = open ? "▸" : "▾";
  });

  cardEl.addEventListener("pointerdown", onDown);
  cardEl.addEventListener("pointermove", onMove);
  cardEl.addEventListener("pointerup", onUp);
  cardEl.addEventListener("pointerleave", onUp);
  cardEl.addEventListener("click", e=>{ if(!moved) flip(); });
});
</script>
</main>
</body>
</html>
